<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PinPoint — track where you've been</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2220%22 font-size=%2222%22>📍</text></svg>" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-pin">📍</span>
      <span class="brand-name">PinPoint</span>
    </div>
    <div class="stats" id="stats">
      <div class="stat"><span class="stat-num" id="statPlaces">0</span><span class="stat-label">places</span></div>
      <div class="stat"><span class="stat-num" id="statCountries">0</span><span class="stat-label">countries</span></div>
    </div>
    <div class="topbar-actions">
      <button id="exportBtn" class="btn btn-ghost" title="Export your pins as JSON">Export</button>
      <button id="importBtn" class="btn btn-ghost" title="Import pins from JSON">Import</button>
      <input type="file" id="importFile" accept="application/json" hidden />
      <button id="themeToggle" class="btn btn-icon" title="Toggle theme">🌙</button>
    </div>
  </header>

  <div class="body">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <input type="search" id="searchInput" placeholder="Search your places…" />
      </div>
      <div class="sidebar-hint">Click anywhere on the map to drop a pin.</div>
      <ul class="place-list" id="placeList"></ul>
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">🗺️</div>
        <p>No places yet. Click the map to add your first pin.</p>
      </div>
    </aside>

    <main class="map-wrap">
      <div id="map"></div>
    </main>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h2 id="modalTitle">New pin</h2>
    <form id="pinForm">
      <label>
        Name
        <input type="text" id="pinName" placeholder="e.g. Kyoto, Japan" required />
      </label>
      <label>
        Country
        <input type="text" id="pinCountry" placeholder="e.g. Japan" />
      </label>
      <label>
        Date visited
        <input type="date" id="pinDate" />
      </label>
      <label>
        Notes
        <textarea id="pinNotes" rows="3" placeholder="Anything worth remembering…"></textarea>
      </label>
      <label>
        Rating
        <div class="rating" id="ratingInput" data-value="0">
          <span data-star="1">★</span><span data-star="2">★</span><span data-star="3">★</span><span data-star="4">★</span><span data-star="5">★</span>
        </div>
      </label>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="deletePinBtn" hidden>Delete</button>
        <div class="modal-actions-right">
          <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save pin</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
